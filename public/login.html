<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120703">
<meta name="color-scheme" content="dark">
<title>Вход · HANABI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<style>
:root{
  --bg:#120703; --orange:#ff6a00; --orange2:#ff9a3c; --amber:#ffb347;
  --deep:#c2410c; --cream:#fff3e4; --muted:#c9a58a;
  --glass:rgba(255,140,50,.08); --glass-brd:rgba(255,150,60,.22);
  --font:'Manrope',system-ui,sans-serif; --display:'Unbounded',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--cream);
  min-height:100vh;display:grid;place-items:center;padding:24px;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
.aurora{
  position:fixed;inset:-30%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(45% 40% at 20% 25%, rgba(255,106,0,.35), transparent 60%),
    radial-gradient(40% 35% at 80% 15%, rgba(255,160,50,.25), transparent 60%),
    radial-gradient(55% 50% at 60% 85%, rgba(194,65,12,.40), transparent 65%);
  filter:blur(20px);animation:swirl 26s ease-in-out infinite alternate;
}
@keyframes swirl{0%{transform:rotate(0) scale(1)}100%{transform:rotate(8deg) scale(1.12)}}
.glow{
  position:fixed;width:520px;height:520px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle, rgba(255,106,0,.28), transparent 65%);
  filter:blur(40px);animation:float 9s ease-in-out infinite alternate;
}
.glow.g2{right:-160px;bottom:-160px;animation-delay:-4s;background:radial-gradient(circle, rgba(255,170,60,.22), transparent 65%)}
@keyframes float{to{transform:translate(40px,-30px) scale(1.08)}}

.card{
  width:min(440px,100%);position:relative;
  background:linear-gradient(165deg,rgba(44,20,8,.92),rgba(26,12,5,.94));
  border:1px solid rgba(255,150,60,.3);border-radius:28px;
  padding:38px 32px 32px;
  box-shadow:0 50px 120px -30px rgba(255,106,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(20px);
  animation:in .6s cubic-bezier(.2,.9,.3,1);
}
@keyframes in{from{opacity:0;transform:translateY(36px) scale(.95)}to{opacity:1;transform:none}}

.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.logo-mark{font-size:34px;filter:drop-shadow(0 0 16px rgba(255,140,0,.95));animation:flick 2.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.14) rotate(5deg)}}
.logo-text{
  font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.5px;
  background:linear-gradient(100deg,#ffd9a8,#ff6a00 55%,#ff9a3c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo-text i{font-style:normal;color:var(--orange);-webkit-text-fill-color:var(--orange)}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:26px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--glass);
  border:1px solid var(--glass-brd);border-radius:100px;padding:5px;margin-bottom:26px}
.tab{
  border:none;cursor:pointer;padding:11px;border-radius:100px;
  font-family:var(--font);font-weight:800;font-size:14px;color:var(--muted);
  background:transparent;transition:.28s cubic-bezier(.2,.8,.3,1);
}
.tab.on{background:linear-gradient(135deg,#ffd08a,#ff6a00);color:#1a0a02;
  box-shadow:0 8px 22px -8px rgba(255,106,0,.9)}

.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.inwrap{position:relative}
.inwrap .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  font-size:16px;opacity:.75;pointer-events:none}
.field input{
  width:100%;padding:14px 16px 14px 46px;border-radius:15px;
  background:rgba(255,140,50,.07);border:1.5px solid var(--glass-brd);
  color:var(--cream);font-family:var(--font);font-size:15px;outline:none;
  transition:.25s;
}
.field input::placeholder{color:rgba(255,220,190,.4)}
.field input:focus{border-color:var(--orange);background:rgba(255,140,50,.13);
  box-shadow:0 0 0 4px rgba(255,106,0,.16), 0 0 26px rgba(255,106,0,.28)}
.field input:invalid:not(:placeholder-shown){border-color:rgba(255,90,60,.6)}

.hint{font-size:12px;color:var(--muted);text-align:center;margin:-6px 0 16px;line-height:1.5}
.hint b{color:var(--amber)}

.err{
  display:none;margin-bottom:16px;padding:12px 16px;border-radius:14px;
  background:rgba(255,60,40,.14);border:1.5px solid rgba(255,80,50,.45);
  color:#ff9a85;font-size:13.5px;font-weight:700;text-align:center;
  animation:shake .4s;
}
.err.show{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.btn{
  width:100%;border:none;cursor:pointer;padding:16px;border-radius:100px;
  font-family:var(--font);font-weight:800;font-size:15.5px;position:relative;
  overflow:hidden;transition:.25s cubic-bezier(.2,.8,.3,1);
  background:linear-gradient(135deg,#ffd08a,#ff6a00 55%,#e85d04);
  color:#1a0a02;box-shadow:0 14px 36px -10px rgba(255,106,0,.85), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 20px 46px -10px rgba(255,106,0,1)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  transform:skewX(-20deg);transition:.6s}
.btn:hover::after{left:130%}

.foot{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.foot b{color:var(--amber);cursor:pointer;transition:.2s}
.foot b:hover{color:var(--orange);text-shadow:0 0 14px rgba(255,120,0,.7)}

/* ---------- mobile ---------- */
*{-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh}
.field input{font-size:16px}
@media(max-width:520px){
  body{padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));place-items:center stretch}
  .card{border-radius:26px;padding:30px 20px 24px;width:100%}
  .logo-mark{font-size:30px}
  .logo-text{font-size:26px}
  .sub{margin-bottom:20px}
  .tabs{margin-bottom:20px}
  .glow{width:340px;height:340px}
  .btn{padding:16px;font-size:16px}
  .btn:hover{transform:none}
}
@media(hover:none){.btn:hover{transform:none}.btn:active{transform:scale(.97)}}
</style>
</head>
<body>

<div class="aurora"></div>
<div class="glow"></div>
<div class="glow g2"></div>

<div class="card">
  <div class="logo"><span class="logo-mark">🔥</span><span class="logo-text">HANABI<i>.</i></span></div>
  <p class="sub" id="sub">Войди, чтобы увидеть огонь</p>

  <div class="tabs">
    <button class="tab on" id="tabLogin" type="button">Вход</button>
    <button class="tab" id="tabReg" type="button">Регистрация</button>
  </div>

  <div class="err" id="err"></div>

  <form id="form" novalidate>
    <div class="field">
      <label>Ник</label>
      <div class="inwrap"><span class="ic">👤</span>
        <input type="text" id="username" placeholder="твой ник" autocomplete="username" required minlength="2">
      </div>
    </div>

    <div class="field">
      <label>Пароль</label>
      <div class="inwrap"><span class="ic">🔒</span>
        <input type="password" id="password" placeholder="твой пароль" autocomplete="current-password" required minlength="4">
      </div>
    </div>

    <div class="field">
      <label>Код сайта</label>
      <div class="inwrap"><span class="ic">🗝️</span>
        <input type="password" id="site_password" placeholder="секретный код" autocomplete="off" required>
      </div>
    </div>

    <p class="hint">Код сайта выдаёт владелец. <b>Без него вход невозможен</b> — ни просмотр, ни регистрация.</p>

    <button class="btn" id="submit" type="submit">Войти 🔥</button>
  </form>

  <p class="foot" id="foot">Нет аккаунта? <b id="switch">Зарегистрироваться</b></p>
</div>

<script>
const $ = s => document.querySelector(s);
let mode = location.pathname.includes('register') ? 'reg' : 'login';

function getCookie(n){
  const m = document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

function setMode(m){
  mode = m;
  $('#tabLogin').classList.toggle('on', m==='login');
  $('#tabReg').classList.toggle('on', m==='reg');
  $('#sub').textContent = m==='login' ? 'Войди, чтобы увидеть огонь' : 'Создай аккаунт на сайте';
  $('#submit').textContent = m==='login' ? 'Войти 🔥' : 'Создать аккаунт 🔥';
  $('#password').setAttribute('autocomplete', m==='login' ? 'current-password' : 'new-password');
  $('#foot').innerHTML = m==='login'
    ? 'Нет аккаунта? <b id="switch">Зарегистрироваться</b>'
    : 'Уже есть аккаунт? <b id="switch">Войти</b>';
  $('#switch').onclick = () => setMode(m==='login' ? 'reg' : 'login');
  hideErr();
  history.replaceState(null,'', m==='login' ? '/login/' : '/register/');
}

function showErr(msg){
  const e = $('#err'); e.textContent = msg; e.classList.add('show');
}
function hideErr(){ $('#err').classList.remove('show'); }

$('#tabLogin').onclick = () => setMode('login');
$('#tabReg').onclick = () => setMode('reg');
$('#switch') && ($('#switch').onclick = () => setMode('reg'));

// уже вошли? — на главную
fetch('/api/auth/me').then(r => { if (r.ok) location.replace('/'); }).catch(()=>{});

$('#form').addEventListener('submit', async ev => {
  ev.preventDefault();
  hideErr();
  const username = $('#username').value.trim();
  const password = $('#password').value;
  const site_password = $('#site_password').value;
  if (!username || !password || !site_password) return showErr('Заполни все поля');

  const btn = $('#submit');
  btn.disabled = true; btn.textContent = 'Проверяем...';
  try {
    const r = await fetch('/api/auth/' + (mode==='login' ? 'login' : 'register'), {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-CSRFToken': getCookie('csrftoken')},
      body: JSON.stringify({username, password, site_password})
    });
    const data = await r.json().catch(()=>({}));
    if (!r.ok) throw new Error(data.error || 'Ошибка (' + r.status + ')');
    location.replace('/');
  } catch(e) {
    showErr(e.message);
    btn.disabled = false;
    btn.textContent = mode==='login' ? 'Войти 🔥' : 'Создать аккаунт 🔥';
  }
});
</script>
<script src="rain.js"></script>
</body>
</html>
